defaults:
  - backbone: ResNet
  - head: MLP
  - optimizer: Adam
  - scheduler: CosineAnnealingLR
  - _self_

architecture:
  backbone: ResNet
  head: MLP

training:
  data_path: data/train.npz
  batch_size: 32
  epochs: 30
  num_workers: 4
  device: auto # auto, cuda, or cpu

normalization: mean

early_stopping:
  patience: 10
  min_delta: 0.0001

label_smoothing: 0.1

augmentation:
  horizontal_flip: true

fit_threshold: false